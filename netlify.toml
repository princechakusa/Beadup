# Netlify: the web app (booking links, website, API for the mobile app).
# Secrets are set in the Netlify UI (Site configuration > Environment variables),
# never here. See .env.example for the list.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Next.js runtime (server functions, middleware/proxy, caching). Named
# explicitly because auto-detection skips it when the app is in a subfolder.
[[plugins]]
  package = "@netlify/plugin-nextjs"
