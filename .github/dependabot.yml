# Weekly dependency update PRs (rules.md section 7: dependency scanning).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Expo SDK packages move together; upgrade them with `npx expo install --fix`.
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
